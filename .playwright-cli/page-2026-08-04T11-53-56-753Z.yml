          - heading "The schema is the single source of truth." [level=2] [ref=f4e248]
          - paragraph [ref=f4e249]: Change a field and TypeScript follows the change into filters, writes, relations, selections, and returned records immediately.
        - generic [ref=f4e250]:
          - article [ref=f4e251]:
            - heading "Inference, not generation" [level=3] [ref=f4e257]
            - paragraph [ref=f4e258]: Types flow from immutable schema definitions into every client operation and result.
          - article [ref=f4e259]:
            - heading "Prisma-inspired client" [level=3] [ref=f4e263]
            - paragraph [ref=f4e264]: Use familiar create, find, update, upsert, delete, aggregation, and transaction APIs.
          - article [ref=f4e265]:
            - heading "One ORM, three dialects" [level=3] [ref=f4e272]
            - paragraph [ref=f4e273]: Keep one schema and one query surface across PostgreSQL, MySQL, and SQLite.
          - article [ref=f4e274]:
            - heading "Relations stay typed" [level=3] [ref=f4e281]
            - paragraph [ref=f4e282]: Model one-to-one, one-to-many, and many-to-many relations with typed nested reads and writes.
          - article [ref=f4e283]:
            - heading "Standard Schema V1" [level=3] [ref=f4e289]
