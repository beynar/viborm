          - heading "The schema is the single source of truth." [level=2] [ref=f7e164]
          - paragraph [ref=f7e165]: Change a field and TypeScript follows the change into filters, writes, relations, selections, and returned records immediately.
        - generic [ref=f7e166]:
          - article [ref=f7e167]:
            - heading "Inference, not generation" [level=3] [ref=f7e173]
            - paragraph [ref=f7e174]: Types flow from immutable schema definitions into every client operation and result.
          - article [ref=f7e175]:
            - heading "Prisma-inspired client" [level=3] [ref=f7e179]
            - paragraph [ref=f7e180]: Use familiar create, find, update, upsert, delete, aggregation, and transaction APIs.
          - article [ref=f7e181]:
            - heading "One ORM, three dialects" [level=3] [ref=f7e188]
            - paragraph [ref=f7e189]: Keep one schema and one query surface across PostgreSQL, MySQL, and SQLite.
          - article [ref=f7e190]:
            - heading "Relations stay typed" [level=3] [ref=f7e197]
            - paragraph [ref=f7e198]: Model one-to-one, one-to-many, and many-to-many relations with typed nested reads and writes.
          - article [ref=f7e199]:
            - heading "Standard Schema V1" [level=3] [ref=f7e205]
            - paragraph [ref=f7e206]: Validate through the Standard Schema interface and interoperate with its growing ecosystem.
