            - paragraph [ref=f7e275]: Database isomorphisms
            - heading "One concept, even when the database lacks the primitive." [level=2] [ref=f7e276]
            - paragraph [ref=f7e277]: PostgreSQL, MySQL, and SQLite do not expose the same type system. VibORM maps one portable schema to different physical representations while preserving the behavior your application sees.
