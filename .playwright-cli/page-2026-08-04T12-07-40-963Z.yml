          - heading "The schema is the single source of truth." [level=2] [ref=f13e130]
          - paragraph [ref=f13e131]: Change a field and TypeScript follows the change into filters, writes, relations, selections, and returned records immediately.
        - generic [ref=f13e132]:
          - article [ref=f13e133]:
            - heading "Inference, not generation" [level=3] [ref=f13e139]
            - paragraph [ref=f13e140]: Types flow from immutable schema definitions into every client operation and result.
          - article [ref=f13e141]:
            - heading "Prisma-inspired client" [level=3] [ref=f13e145]
            - paragraph [ref=f13e146]: Use familiar create, find, update, upsert, delete, aggregation, and transaction APIs.
          - article [ref=f13e147]:
            - heading "One ORM, three dialects" [level=3] [ref=f13e154]
            - paragraph [ref=f13e155]: Keep one schema and one query surface across PostgreSQL, MySQL, and SQLite.
          - article [ref=f13e156]:
            - heading "Relations stay typed" [level=3] [ref=f13e163]
            - paragraph [ref=f13e164]: Model one-to-one, one-to-many, and many-to-many relations with typed nested reads and writes.
          - article [ref=f13e165]:
            - heading "Standard Schema V1" [level=3] [ref=f13e171]
            - paragraph [ref=f13e172]: Validate through the Standard Schema interface and interoperate with its growing ecosystem.
