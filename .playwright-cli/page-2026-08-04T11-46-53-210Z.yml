          - heading "The schema is the single source of truth." [level=2] [ref=f2e164]
          - paragraph [ref=f2e165]: Change a field and TypeScript follows the change into filters, writes, relations, selections, and returned records immediately.
        - generic [ref=f2e166]:
          - article [ref=f2e167]:
            - heading "Inference, not generation" [level=3] [ref=f2e173]
            - paragraph [ref=f2e174]: Types flow from immutable schema definitions into every client operation and result.
          - article [ref=f2e175]:
            - heading "Prisma-inspired client" [level=3] [ref=f2e179]
            - paragraph [ref=f2e180]: Use familiar create, find, update, upsert, delete, aggregation, and transaction APIs.
          - article [ref=f2e181]:
            - heading "One ORM, three dialects" [level=3] [ref=f2e188]
            - paragraph [ref=f2e189]: Keep one schema and one query surface across PostgreSQL, MySQL, and SQLite.
          - article [ref=f2e190]:
            - heading "Relations stay typed" [level=3] [ref=f2e197]
            - paragraph [ref=f2e198]: Model one-to-one, one-to-many, and many-to-many relations with typed nested reads and writes.
          - article [ref=f2e199]:
            - heading "Standard Schema V1" [level=3] [ref=f2e205]
            - paragraph [ref=f2e206]: Validate through the Standard Schema interface and interoperate with its growing ecosystem.
          - article [ref=f2e207]:
            - heading "Drivers for your runtime" [level=3] [ref=f2e211]
            - paragraph [ref=f2e212]: Run on Node.js, Bun, serverless databases, and Cloudflare D1 through focused drivers.
