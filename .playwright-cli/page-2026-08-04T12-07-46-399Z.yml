          - heading "The schema is the single source of truth." [level=2] [ref=f14e130]
          - paragraph [ref=f14e131]: Change a field and TypeScript follows the change into filters, writes, relations, selections, and returned records immediately.
        - generic [ref=f14e132]:
          - article [ref=f14e133]:
            - heading "Inference, not generation" [level=3] [ref=f14e139]
            - paragraph [ref=f14e140]: Types flow from immutable schema definitions into every client operation and result.
          - article [ref=f14e141]:
            - heading "Prisma-inspired client" [level=3] [ref=f14e145]
            - paragraph [ref=f14e146]: Use familiar create, find, update, upsert, delete, aggregation, and transaction APIs.
          - article [ref=f14e147]:
            - heading "One ORM, three dialects" [level=3] [ref=f14e154]
            - paragraph [ref=f14e155]: Keep one schema and one query surface across PostgreSQL, MySQL, and SQLite.
          - article [ref=f14e156]:
            - heading "Relations stay typed" [level=3] [ref=f14e163]
            - paragraph [ref=f14e164]: Model one-to-one, one-to-many, and many-to-many relations with typed nested reads and writes.
