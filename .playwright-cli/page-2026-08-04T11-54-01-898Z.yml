          - paragraph [ref=f5e220]: Everything stays connected
          - heading "The schema is the single source of truth." [level=2] [ref=f5e221]
          - paragraph [ref=f5e222]: Change a field and TypeScript follows the change into filters, writes, relations, selections, and returned records immediately.
        - generic [ref=f5e223]:
          - article [ref=f5e224]:
            - heading "Inference, not generation" [level=3] [ref=f5e230]
            - paragraph [ref=f5e231]: Types flow from immutable schema definitions into every client operation and result.
          - article [ref=f5e232]:
            - heading "Prisma-inspired client" [level=3] [ref=f5e236]
            - paragraph [ref=f5e237]: Use familiar create, find, update, upsert, delete, aggregation, and transaction APIs.
          - article [ref=f5e238]:
            - heading "One ORM, three dialects" [level=3] [ref=f5e245]
            - paragraph [ref=f5e246]: Keep one schema and one query surface across PostgreSQL, MySQL, and SQLite.
          - article [ref=f5e247]:
            - heading "Relations stay typed" [level=3] [ref=f5e254]
            - paragraph [ref=f5e255]: Model one-to-one, one-to-many, and many-to-many relations with typed nested reads and writes.
          - article [ref=f5e256]:
            - heading "Standard Schema V1" [level=3] [ref=f5e262]
            - paragraph [ref=f5e263]: Validate through the Standard Schema interface and interoperate with its growing ecosystem.
