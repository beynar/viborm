            - heading "Inference, not generation" [level=3] [ref=f8e139]
            - paragraph [ref=f8e140]: Types flow from immutable schema definitions into every client operation and result.
          - article [ref=f8e141]:
            - heading "Prisma-inspired client" [level=3] [ref=f8e145]
            - paragraph [ref=f8e146]: Use familiar create, find, update, upsert, delete, aggregation, and transaction APIs.
          - article [ref=f8e147]:
            - heading "One ORM, three dialects" [level=3] [ref=f8e154]
            - paragraph [ref=f8e155]: Keep one schema and one query surface across PostgreSQL, MySQL, and SQLite.
          - article [ref=f8e156]:
            - heading "Relations stay typed" [level=3] [ref=f8e163]
            - paragraph [ref=f8e164]: Model one-to-one, one-to-many, and many-to-many relations with typed nested reads and writes.
