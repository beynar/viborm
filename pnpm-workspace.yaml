packages:
  - docs
  - packages/studio
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  protobufjs: true
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - better-sqlite3
  - esbuild
  - prisma
  - protobufjs
overrides:
  fast-uri@3.1.4: 3.1.8
  brace-expansion@5.0.9: 5.0.12
  sharp@0.35.4: 0.35.5
  dompurify@3.4.16: 3.4.17
  body-parser@2.3.0: 2.4.0
  zod@4.1.11: 4.6.7
  mysql2@3.15.3: 3.24.5
  mysql2@3.16.1: 3.24.5
  '@prisma/config>deepmerge-ts': 8.0.0
  undici@7.18.2: 7.30.1
  undici@7.29.1: 7.30.1
  undici@7.30.0: 7.30.1
  undici@8.11.2: 8.12.3
patchedDependencies:
  http-cache-semantics@4.3.0: patches/http-cache-semantics@4.3.0.patch
  deepmerge-ts@8.0.0: patches/deepmerge-ts@8.0.0.patch
  miniflare@4.20251011.0: patches/miniflare@4.20251011.0.patch
auditConfig:
  ignoreGhsas:
    # SvelteKit remote-function form parsing (DoS). @sveltejs/kit is only the
    # optional peer of @vercel/analytics under blume, in the Astro docs site,
    # which never runs SvelteKit; the fix exists only in kit 3.1.1, which
    # blume's dependents do not accept yet. Drop this once blume moves.
    - GHSA-3r8g-jcqq-3p5j
    # picomatch ReDoS through repeated extglobs: every version is affected and
    # none is patched yet. It reaches the audit only through the Astro docs
    # site (blume, and astro > unstorage > anymatch), which matches its own
    # build globs, never user input. Drop this once a fixed picomatch exists.
    - GHSA-fc5q-39xc-vjpf
    # effect ReDoS in Schema.TemplateLiteral (published 2026-11-20). It reaches
    # the audit only through the Astro docs site (blume > astro > unstorage >
    # db0 > drizzle-orm > prisma > @prisma/config > effect), which compiles no
    # template literal schema from user input. Drop this once that chain takes
    # effect 3.22.1.
    - GHSA-7589-6fvf-x4pw
