        - paragraph [ref=e208]: Same API across PostgreSQL, MySQL, and SQLite.
      - generic [ref=e209]:
        - generic [ref=e210]:
          - heading "Scalar Arrays" [level=3] [ref=e214]
          - paragraph [ref=e215]: MySQL doesn't support array columns natively. VibORM emulates them with JSON — same API, same types, any database.
        - generic [ref=e216]:
          - heading "DISTINCT Queries" [level=3] [ref=e220]
          - paragraph [ref=e221]: DISTINCT ON isn't available everywhere. VibORM provides consistent distinct behavior across all supported databases.
        - generic [ref=e222]:
          - heading "Switch Anytime" [level=3] [ref=e226]
          - paragraph [ref=e227]: Start with SQLite for development, deploy to PostgreSQL. Your queries don't change — the ORM handles the translation.
