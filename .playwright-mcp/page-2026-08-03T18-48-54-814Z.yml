  - article [ref=f2e350]:
    - heading "Model" [level=1] [ref=f2e351]
    - paragraph [ref=f2e352]: "Define database tables with fields: scalar columns and relation associations"
    - generic [ref=f2e353]:
      - heading [level=2] [ref=f2e354]:
        - link "Creating a Model" [ref=f2e355] [cursor=pointer]:
          - /url: "#creating-a-model"
        - button "Copy Anchor Link" [ref=f2e356]
      - paragraph [ref=f2e360]:
        - text: Use
        - code [ref=f2e361]: s.model()
        - text: "with an object of field definitions (scalars and relations):"
      - figure [ref=f2e362]:
        - button "Copy Text" [ref=f2e364]
        - region [ref=f2e368]:
          - code [ref=f2e370]:
            - generic [ref=f2e371]: "import { s } from \"viborm\";"
            - generic [ref=f2e373]: "const user = s.model({"
            - generic [ref=f2e374]: "id: s.string().id().ulid(),"
            - generic [ref=f2e375]: "email: s.string().unique(),"
            - generic [ref=f2e376]: "name: s.string(),"
            - generic [ref=f2e377]: "createdAt: s.dateTime().default(() => new Date()),"
            - generic [ref=f2e378]: "});"
      - heading [level=2] [ref=f2e379]:
        - link "Table Name" [ref=f2e380] [cursor=pointer]:
          - /url: "#table-name"
        - button "Copy Anchor Link" [ref=f2e381]
      - paragraph [ref=f2e385]:
        - text: By default, VibORM uses the variable name. Use
        - code [ref=f2e386]: .map()
        - text: "to set a custom table name:"
      - figure [ref=f2e387]:
        - button "Copy Text" [ref=f2e389]
        - region [ref=f2e393]:
          - code [ref=f2e395]:
            - generic [ref=f2e396]: const user = s
            - generic [ref=f2e397]: ".model({"
            - generic [ref=f2e398]: "id: s.string().id(),"
            - generic [ref=f2e399]: // ...
            - generic [ref=f2e400]: "})"
            - generic [ref=f2e401]: ".map(\"users\"); // SQL: CREATE TABLE \"users\" (...)"
      - heading [level=2] [ref=f2e402]:
        - link "Chainable Methods" [ref=f2e403] [cursor=pointer]:
          - /url: "#chainable-methods"
        - button "Copy Anchor Link" [ref=f2e404]
      - heading [level=3] [ref=f2e408]:
        - link [ref=f2e409] [cursor=pointer]:
          - /url: "#maptablename"
          - code [ref=f2e410]: .map(tableName)
        - button "Copy Anchor Link" [ref=f2e411]
      - paragraph [ref=f2e415]: Sets the database table name.
      - figure [ref=f2e416]:
        - button "Copy Text" [ref=f2e418]
        - region [ref=f2e422]:
          - code [ref=f2e424]:
            - generic [ref=f2e425]: .map("users")
            - generic [ref=f2e426]: .map("user_accounts")
      - heading [level=3] [ref=f2e427]:
        - link [ref=f2e428] [cursor=pointer]:
          - /url: "#indexfields-options"
          - code [ref=f2e429]: .index(fields, options?)
        - button "Copy Anchor Link" [ref=f2e430]
      - paragraph [ref=f2e434]: "Adds an index on one or more fields. Fields are always passed as an array:"
      - figure [ref=f2e435]:
        - button "Copy Text" [ref=f2e437]
        - region [ref=f2e441]:
          - code [ref=f2e443]:
            - generic [ref=f2e444]: // Single field index
            - generic [ref=f2e445]: .index(["email"])
            - generic [ref=f2e447]: // Composite index
            - generic [ref=f2e448]: .index(["lastName", "firstName"])
            - generic [ref=f2e450]: // With options
            - generic [ref=f2e451]: ".index([\"status\", \"createdAt\"], {"
            - generic [ref=f2e452]: "name: \"idx_status_date\","
            - generic [ref=f2e453]: "type: \"btree\", // btree | hash | gin | gist"
            - generic [ref=f2e454]: "unique: false,"
            - generic [ref=f2e455]: "where: \"status != 'deleted'\" // Partial index (PostgreSQL)"
            - generic [ref=f2e456]: "})"
      - paragraph [ref=f2e457]:
        - text: The foreign-key fields of a
        - code [ref=f2e458]: manyToOne
        - text: "relation are indexed for you:"
        - code [ref=f2e459]: push
        - text: and
        - code [ref=f2e460]: migrate
        - text: add an index over them on every database. Declare your own index over the same fields — first in the list, so the index still serves them — when you want more columns in it; the automatic index is then not added.
      - heading [level=3] [ref=f2e461]:
        - link [ref=f2e462] [cursor=pointer]:
          - /url: "#idfields-options"
          - code [ref=f2e463]: .id(fields, options?)
        - button "Copy Anchor Link" [ref=f2e464]
      - paragraph [ref=f2e468]: "Defines a compound primary key (when multiple fields form the PK):"
      - figure [ref=f2e469]:
        - button "Copy Text" [ref=f2e471]
        - region [ref=f2e475]:
          - code [ref=f2e477]:
            - generic [ref=f2e478]: "const membership = s.model({"
            - generic [ref=f2e479]: "orgId: s.string(),"
            - generic [ref=f2e480]: "userId: s.string(),"
            - generic [ref=f2e481]: "role: s.string(),"
            - generic [ref=f2e482]: "}).id([\"orgId\", \"userId\"]);"
            - generic [ref=f2e484]: // With custom constraint name
            - generic [ref=f2e485]: ".id([\"orgId\", \"userId\"], { name: \"membership_pk\" })"
      - heading [level=3] [ref=f2e486]:
        - link [ref=f2e487] [cursor=pointer]:
          - /url: "#uniquefields-options"
          - code [ref=f2e488]: .unique(fields, options?)
        - button "Copy Anchor Link" [ref=f2e489]
      - paragraph [ref=f2e493]: "Adds a compound unique constraint:"
      - figure [ref=f2e494]:
        - button "Copy Text" [ref=f2e496]
        - region [ref=f2e500]:
          - code [ref=f2e502]:
            - generic [ref=f2e503]: "const user = s.model({"
            - generic [ref=f2e504]: "id: s.string().id(),"
            - generic [ref=f2e505]: "email: s.string(),"
            - generic [ref=f2e506]: "orgId: s.string(),"
            - generic [ref=f2e507]: "}).unique([\"email\", \"orgId\"]);"
            - generic [ref=f2e509]: // With custom constraint name
            - generic [ref=f2e510]: ".unique([\"email\", \"orgId\"], { name: \"user_email_org_unique\" })"
      - heading [level=3] [ref=f2e511]:
        - link [ref=f2e512] [cursor=pointer]:
          - /url: "#extendsfields"
          - code [ref=f2e513]: .extends(fields)
        - button "Copy Anchor Link" [ref=f2e514]
      - paragraph [ref=f2e518]: "Adds additional fields to an existing model:"
      - figure [ref=f2e519]:
        - button "Copy Text" [ref=f2e521]
        - region [ref=f2e525]:
          - code [ref=f2e527]:
            - generic [ref=f2e528]: "const baseModel = s.model({"
            - generic [ref=f2e529]: "id: s.string().id(),"
            - generic [ref=f2e530]: "createdAt: s.dateTime().default(() => new Date()),"
            - generic [ref=f2e531]: "});"
            - generic [ref=f2e533]: "const user = baseModel.extends({"
            - generic [ref=f2e534]: "email: s.string().unique(),"
            - generic [ref=f2e535]: "name: s.string(),"
            - generic [ref=f2e536]: "});"
