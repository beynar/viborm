        - heading "Database Abstraction" [level=2] [ref=f1e345]
        - paragraph [ref=f1e346]: Same API across PostgreSQL, MySQL, and SQLite.
      - generic [ref=f1e347]:
        - generic [ref=f1e348]:
          - heading "Scalar Arrays" [level=3] [ref=f1e352]
          - paragraph [ref=f1e353]: MySQL doesn't support array columns natively. VibORM emulates them with JSON — same API, same types, any database.
        - generic [ref=f1e354]:
          - heading "DISTINCT Queries" [level=3] [ref=f1e358]
          - paragraph [ref=f1e359]: DISTINCT ON isn't available everywhere. VibORM provides consistent distinct behavior across all supported databases.
        - generic [ref=f1e360]:
          - heading "Switch Anytime" [level=3] [ref=f1e364]
          - paragraph [ref=f1e365]: Start with SQLite for development, deploy to PostgreSQL. Your queries don't change — the ORM handles the translation.
