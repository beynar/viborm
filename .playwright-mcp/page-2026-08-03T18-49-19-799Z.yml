      - generic [ref=f3e206]:
        - heading "Database Abstraction" [level=2] [ref=f3e207]
        - paragraph [ref=f3e208]: Same API across PostgreSQL, MySQL, and SQLite.
      - generic [ref=f3e209]:
        - generic [ref=f3e210]:
          - heading "Scalar Arrays" [level=3] [ref=f3e214]
          - paragraph [ref=f3e215]: MySQL doesn't support array columns natively. VibORM emulates them with JSON — same API, same types, any database.
        - generic [ref=f3e216]:
          - heading "DISTINCT Queries" [level=3] [ref=f3e220]
          - paragraph [ref=f3e221]: DISTINCT ON isn't available everywhere. VibORM provides consistent distinct behavior across all supported databases.
        - generic [ref=f3e222]:
          - heading "Switch Anytime" [level=3] [ref=f3e226]
          - paragraph [ref=f3e227]: Start with SQLite for development, deploy to PostgreSQL. Your queries don't change — the ORM handles the translation.
