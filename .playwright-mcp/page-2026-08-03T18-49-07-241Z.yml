  - article [ref=f2e1010]:
    - heading "Model" [level=1] [ref=f2e1011]
    - paragraph [ref=f2e1012]: "Define database tables with fields: scalar columns and relation associations"
    - generic [ref=f2e1013]:
      - heading [level=2] [ref=f2e1014]:
        - link "Creating a Model" [ref=f2e1015] [cursor=pointer]:
          - /url: "#creating-a-model"
        - button "Copy Anchor Link" [ref=f2e1016]
      - paragraph [ref=f2e1020]:
        - text: Use
        - code [ref=f2e1021]: s.model()
        - text: "with an object of field definitions (scalars and relations):"
      - figure [ref=f2e1022]:
        - button "Copy Text" [ref=f2e1024]
        - region [ref=f2e1028]:
          - code [ref=f2e1030]:
            - generic [ref=f2e1031]: "import { s } from \"viborm\";"
            - generic [ref=f2e1033]: "const user = s.model({"
            - generic [ref=f2e1034]: "id: s.string().id().ulid(),"
            - generic [ref=f2e1035]: "email: s.string().unique(),"
            - generic [ref=f2e1036]: "name: s.string(),"
            - generic [ref=f2e1037]: "createdAt: s.dateTime().default(() => new Date()),"
            - generic [ref=f2e1038]: "});"
      - heading [level=2] [ref=f2e1039]:
        - link "Table Name" [ref=f2e1040] [cursor=pointer]:
          - /url: "#table-name"
        - button "Copy Anchor Link" [ref=f2e1041]
      - paragraph [ref=f2e1045]:
        - text: By default, VibORM uses the variable name. Use
        - code [ref=f2e1046]: .map()
        - text: "to set a custom table name:"
      - figure [ref=f2e1047]:
        - button "Copy Text" [ref=f2e1049]
        - region [ref=f2e1053]:
          - code [ref=f2e1055]:
            - generic [ref=f2e1056]: const user = s
            - generic [ref=f2e1057]: ".model({"
            - generic [ref=f2e1058]: "id: s.string().id(),"
            - generic [ref=f2e1059]: // ...
            - generic [ref=f2e1060]: "})"
            - generic [ref=f2e1061]: ".map(\"users\"); // SQL: CREATE TABLE \"users\" (...)"
      - heading [level=2] [ref=f2e1062]:
        - link "Chainable Methods" [ref=f2e1063] [cursor=pointer]:
          - /url: "#chainable-methods"
        - button "Copy Anchor Link" [ref=f2e1064]
      - heading [level=3] [ref=f2e1068]:
        - link [ref=f2e1069] [cursor=pointer]:
          - /url: "#maptablename"
          - code [ref=f2e1070]: .map(tableName)
        - button "Copy Anchor Link" [ref=f2e1071]
      - paragraph [ref=f2e1075]: Sets the database table name.
      - figure [ref=f2e1076]:
        - button "Copy Text" [ref=f2e1078]
        - region [ref=f2e1082]:
          - code [ref=f2e1084]:
            - generic [ref=f2e1085]: .map("users")
            - generic [ref=f2e1086]: .map("user_accounts")
      - heading [level=3] [ref=f2e1087]:
        - link [ref=f2e1088] [cursor=pointer]:
          - /url: "#indexfields-options"
          - code [ref=f2e1089]: .index(fields, options?)
        - button "Copy Anchor Link" [ref=f2e1090]
      - paragraph [ref=f2e1094]: "Adds an index on one or more fields. Fields are always passed as an array:"
      - figure [ref=f2e1095]:
        - button "Copy Text" [ref=f2e1097]
        - region [ref=f2e1101]:
          - code [ref=f2e1103]:
            - generic [ref=f2e1104]: // Single field index
            - generic [ref=f2e1105]: .index(["email"])
            - generic [ref=f2e1107]: // Composite index
            - generic [ref=f2e1108]: .index(["lastName", "firstName"])
            - generic [ref=f2e1110]: // With options
            - generic [ref=f2e1111]: ".index([\"status\", \"createdAt\"], {"
            - generic [ref=f2e1112]: "name: \"idx_status_date\","
            - generic [ref=f2e1113]: "type: \"btree\", // btree | hash | gin | gist"
            - generic [ref=f2e1114]: "unique: false,"
            - generic [ref=f2e1115]: "where: \"status != 'deleted'\" // Partial index (PostgreSQL)"
            - generic [ref=f2e1116]: "})"
      - paragraph [ref=f2e1117]:
        - text: The foreign-key fields of a
        - code [ref=f2e1118]: manyToOne
        - text: "relation are indexed for you:"
        - code [ref=f2e1119]: push
        - text: and
        - code [ref=f2e1120]: migrate
        - text: add an index over them on every database. Declare your own index over the same fields — first in the list, so the index still serves them — when you want more columns in it; the automatic index is then not added.
      - heading [level=3] [ref=f2e1121]:
        - link [ref=f2e1122] [cursor=pointer]:
          - /url: "#idfields-options"
          - code [ref=f2e1123]: .id(fields, options?)
        - button "Copy Anchor Link" [ref=f2e1124]
      - paragraph [ref=f2e1128]: "Defines a compound primary key (when multiple fields form the PK):"
      - figure [ref=f2e1129]:
        - button "Copy Text" [ref=f2e1131]
        - region [ref=f2e1135]:
          - code [ref=f2e1137]:
            - generic [ref=f2e1138]: "const membership = s.model({"
            - generic [ref=f2e1139]: "orgId: s.string(),"
            - generic [ref=f2e1140]: "userId: s.string(),"
            - generic [ref=f2e1141]: "role: s.string(),"
            - generic [ref=f2e1142]: "}).id([\"orgId\", \"userId\"]);"
            - generic [ref=f2e1144]: // With custom constraint name
            - generic [ref=f2e1145]: ".id([\"orgId\", \"userId\"], { name: \"membership_pk\" })"
      - heading [level=3] [ref=f2e1146]:
        - link [ref=f2e1147] [cursor=pointer]:
          - /url: "#uniquefields-options"
          - code [ref=f2e1148]: .unique(fields, options?)
        - button "Copy Anchor Link" [ref=f2e1149]
      - paragraph [ref=f2e1153]: "Adds a compound unique constraint:"
      - figure [ref=f2e1154]:
        - button "Copy Text" [ref=f2e1156]
        - region [ref=f2e1160]:
          - code [ref=f2e1162]:
            - generic [ref=f2e1163]: "const user = s.model({"
            - generic [ref=f2e1164]: "id: s.string().id(),"
            - generic [ref=f2e1165]: "email: s.string(),"
            - generic [ref=f2e1166]: "orgId: s.string(),"
            - generic [ref=f2e1167]: "}).unique([\"email\", \"orgId\"]);"
            - generic [ref=f2e1169]: // With custom constraint name
            - generic [ref=f2e1170]: ".unique([\"email\", \"orgId\"], { name: \"user_email_org_unique\" })"
      - heading [level=3] [ref=f2e1171]:
        - link [ref=f2e1172] [cursor=pointer]:
          - /url: "#extendsfields"
          - code [ref=f2e1173]: .extends(fields)
        - button "Copy Anchor Link" [ref=f2e1174]
      - paragraph [ref=f2e1178]: "Adds additional fields to an existing model:"
      - figure [ref=f2e1179]:
        - button "Copy Text" [ref=f2e1181]
        - region [ref=f2e1185]:
          - code [ref=f2e1187]:
            - generic [ref=f2e1188]: "const baseModel = s.model({"
            - generic [ref=f2e1189]: "id: s.string().id(),"
            - generic [ref=f2e1190]: "createdAt: s.dateTime().default(() => new Date()),"
            - generic [ref=f2e1191]: "});"
            - generic [ref=f2e1193]: "const user = baseModel.extends({"
            - generic [ref=f2e1194]: "email: s.string().unique(),"
            - generic [ref=f2e1195]: "name: s.string(),"
            - generic [ref=f2e1196]: "});"
