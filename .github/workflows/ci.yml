name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  NPM_VERSION: "11.15.0"
  PNPM_VERSION: "10.11.0"

# Checkouts retain source, tests, live docs and architecture plans, but not the
# 3.69 GB historical Raptor receipt archive. No archive is deleted from Git.
# Launcher resource ceilings remain unchanged. Coverage runs in coverage.yml
# (push to main, nightly, manual) and absolute timing budgets in
# perf-timings.yml (nightly, manual); neither gates a pull request or release.

jobs:
  quality:
    name: Types, format, and docs
    runs-on: ubuntu-latest
    # The native whole-program typecheck replaces the old sharded type lane.
    # Keep the existing job ceiling; optimize work rather than raising limits.
    timeout-minutes: 70
    env:
      QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/raptor3-evidence/

      # Only the comparison commit is needed, not the repository's history.
      # Materialize changed evidence too, so sparse checkout cannot hide a lint
      # failure in files this pull request actually edits.
      - name: Fetch the quality comparison and changed files
        run: |
          git fetch --no-tags --depth=1 --filter=blob:none origin "${QUALITY_BASE_SHA}"
          git diff --name-only --diff-filter=ACMRT -z "${QUALITY_BASE_SHA}" HEAD |
            xargs -0 -r git checkout --ignore-skip-worktree-bits HEAD --

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cheap gates first for fast feedback.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Verify patched dependency behavior
        run: node scripts/run-node-safe.mjs 512 60000 tests/package/security-dependencies-smoke.mjs

      # scripts/coverage-policy.test.mjs, scripts/bounded-process.test.mjs,
      # scripts/test-run-lock.test.mjs and scripts/raptor3-refusal-census.test.mjs
      # are the regression tests behind manifest completeness, the hard heap and
      # RSS ceilings, verified teardown, the workspace lock, and the refusal
      # census reading the sentences a site builds and throws through the
      # engine's failure owner. The coverage gates themselves run in the
      # Coverage workflow on main, but these static policy tests stay on every
      # pull request so none of that can regress while the rest of CI stays
      # green. Each one runs bounded through scripts/run-node-safe.mjs with a
      # 512 MB heap and a 60 s wall.
      - name: Run runner and coverage policy gates
        run: pnpm test:coverage:policy

      - name: Check CI stage ownership
        run: node scripts/run-node-safe.mjs 512 60000 scripts/credential-free-ci.test.mjs

      - name: Check changed formatting and lint rules
        run: |
          git diff --name-only --diff-filter=ACMRT -z "${QUALITY_BASE_SHA}" HEAD |
            xargs -0 -r pnpm exec biome check --no-errors-on-unmatched

      - name: Check documentation
        run: pnpm --dir docs validate

      - name: Build documentation under the project resource ceiling
        run: pnpm --dir docs build

      - name: Preserve the exact documentation build for render verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viborm-docs-${{ github.sha }}
          path: docs/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Verify the documentation worker without deploying
        working-directory: docs
        env:
          WRANGLER_SEND_METRICS: "false"
        run: >-
          node ../scripts/run-node-safe.mjs 512 60000
          node_modules/wrangler/bin/wrangler.js deploy
          --dry-run --config dist/server/wrangler.json
          --outdir "${RUNNER_TEMP}/viborm-docs-worker"

      - name: Check whitespace
        run: git diff --check "${QUALITY_BASE_SHA}" HEAD

      # The complete lane: every file the root tsconfig intends, checked as
      # ONE native TypeScript 7 program by scripts/run-typecheck.mjs (serial,
      # 8192 MiB allowlisted ceiling). It is the same check `pnpm test` runs.
      - name: Check public types
        run: pnpm test:types

      # @viborm/studio: its Svelte app type-checked, then its package built
      # (the app, then the CLI that bundles VibORM's internals).
      - name: Check the studio app
        run: pnpm --filter @viborm/studio check

      - name: Build the studio package
        run: pnpm --filter @viborm/studio build

  core:
    name: Core tests
    runs-on: ubuntu-latest
    # Sequential Vitest shards retain the aggregate 5-minute wall ceiling and
    # the ordinary per-process memory ceiling, plus 5 minutes for setup.
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/raptor3-evidence/

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run core tests
        run: pnpm test:core

  package:
    name: Package contract (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Retain the 15-minute job ceiling and the separate 300000 ms build and
    # consumer limits. CI12's slower consumer suite took 236 seconds.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22.12.0"
          - "24"
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/raptor3-evidence/

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install exact npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the package surface
        run: pnpm test:package

      - name: Lint the package contract
        run: pnpm package:lint

      - name: Check bundle-size budgets
        run: pnpm size

  local-providers:
    name: Local providers (${{ matrix.lane }})
    runs-on: ubuntu-latest
    # Each leg is its own runner, so no stage shares CPU with a sibling shard:
    # the fixed Raptor stage runs alone, and every other bounded local stage
    # runs serially in exactly one of eight round-robin shards. The former
    # 125-minute aggregate ceiling is retained per leg; every stage keeps its
    # own heap, RSS and wall bounds.
    timeout-minutes: 125
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: Raptor 3 fixed
            select: "--only 'Raptor 3 fixed'"
          - lane: shard 1/8
            select: --shard=1/8
          - lane: shard 2/8
            select: --shard=2/8
          - lane: shard 3/8
            select: --shard=3/8
          - lane: shard 4/8
            select: --shard=4/8
          - lane: shard 5/8
            select: --shard=5/8
          - lane: shard 6/8
            select: --shard=6/8
          - lane: shard 7/8
            select: --shard=7/8
          - lane: shard 8/8
            select: --shard=8/8
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/raptor3-evidence/

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # All nine legs together run the 134 unique --ci-local stages exactly
      # once with unchanged limits; no package build or typecheck runs here.
      - name: Run local-provider ${{ matrix.lane }}
        run: pnpm test:all --ci-local ${{ matrix.select }}

  docker-providers:
    name: PostgreSQL and MySQL providers
    runs-on: ubuntu-latest
    # 45 = the 1800000 ms (30 min) wall the contracts step hands to
    # run-vitest-safe.mjs, + 5 min for the PgBouncer step at its default
    # ceiling, + 5 min setup, + 5 min for the PostGIS and MySQL service
    # containers to pass their health checks. At the former 30 the job was
    # cancelled before its own launcher could ever reach that ceiling, so the
    # inner limit could never fire and never report.
    timeout-minutes: 45
    services:
      postgres:
        image: postgis/postgis@sha256:8828b03e9a95269f808abe62aa83215b22a2d3710f54a55e8040327b7b5f9932 # 16-3.5
        env:
          POSTGRES_DB: viborm
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viborm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb # 8.4
        env:
          MYSQL_DATABASE: viborm
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
      # Transaction mode in front of the service above, reached by its label.
      # Round robin hands consecutive transactions to different backends, as a
      # loaded pooler does; LIFO reuse would hide a session-scoped lock. No
      # health check: a pooler that fails to start fails the PgBouncer step.
      pgbouncer:
        image: edoburu/pgbouncer@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340 # v1.25.2-p0
        env:
          DATABASE_URL: postgres://postgres:password@postgres:5432/viborm
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          SERVER_ROUND_ROBIN: "1"
          MIN_POOL_SIZE: "4"
        ports:
          - 6432:5432
    env:
      PG_TEST_CONNECTION_STRING: postgres://postgres:password@127.0.0.1:5432/viborm
      MYSQL_TEST_CONNECTION_STRING: mysql://root:password@127.0.0.1:3306/viborm
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/raptor3-evidence/

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Docker provider contracts
        run: >-
          node scripts/run-vitest-safe.mjs --wall-limit-ms=1800000 run
          --workspace vitest.workspace.ts
          --project=provider-pg
          --project=provider-postgres
          --project=provider-mysql2
          --project=provider-transaction-options

      # Required since D1: every migration transaction takes its own transaction
      # lock, so push and apply run through a transaction pooler.
      - name: Run push and apply through PgBouncer
        env:
          PGBOUNCER_TEST_CONNECTION_STRING: postgres://postgres:password@127.0.0.1:6432/viborm
        run: >-
          node scripts/run-vitest-safe.mjs run
          --workspace vitest.workspace.ts
          --project=provider-pgbouncer

  platform-providers:
    name: Bun and D1 providers
    runs-on: ubuntu-latest
    # Four Vitest runs at run-vitest-safe.mjs's 300000 ms default ceiling, so
    # at most 20 min of test time, + 5 min setup, + the Bun install and the
    # PostgreSQL service's health check; the package build and `bun check`
    # leg add 7 min at their own ceilings.
    timeout-minutes: 37
    services:
      postgres:
        image: postgis/postgis@sha256:8828b03e9a95269f808abe62aa83215b22a2d3710f54a55e8040327b7b5f9932 # 16-3.5
        env:
          POSTGRES_DB: viborm
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viborm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_CONNECTION_STRING: postgres://postgres:password@127.0.0.1:5432/viborm
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/raptor3-evidence/

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # 1.4.3 is the first Bun with `bun check`.
          bun-version: 1.4.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The package job type-checks this consumer with TypeScript 5.9, 6 and 7;
      # Bun's own checker runs here, where Bun is installed.
      - name: Build the package
        run: pnpm package:build

      - name: Type-check held nested where types with bun check
        env:
          VIBORM_RECURSIVE_WHERE_CHECKERS: bun
        run: node scripts/run-node-safe.mjs 768 120000 tests/package/type-recursive-where-smoke.mjs

      - name: Run Bun contracts
        run: >-
          node scripts/run-vitest-safe.mjs run
          --workspace vitest.workspace.ts
          --project=provider-bun

      # Keep the entry suite apart from the other permissions contracts: together
      # they can exceed the 300 s wall on a slow runner. Resource limits stay fixed.
      - name: Run D1 permissions entry contracts
        run: >-
          node scripts/run-vitest-safe.mjs run
          --workspace vitest.workspace.ts
          --project=provider-d1
          tests/providers/workers/d1-permissions-entry.test.ts

      - name: Run D1 permissions contracts
        run: >-
          node scripts/run-vitest-safe.mjs run
          --workspace vitest.workspace.ts
          --project=provider-d1
          tests/providers/workers/d1-permissions
          --exclude 'tests/providers/workers/d1-permissions-entry.test.ts'

      - name: Run D1 contracts
        run: >-
          node scripts/run-vitest-safe.mjs run
          --workspace vitest.workspace.ts
          --project=provider-d1
          --exclude 'tests/providers/workers/d1-permissions*'

      - name: Run the tenant Durable Object suite
        run: >-
          node scripts/run-vitest-safe.mjs run
          --workspace vitest.workspace.ts
          --project=provider-tenant-do
