name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  NPM_VERSION: "11.15.0"
  PNPM_VERSION: "10.11.0"

# Checkouts retain source, tests, live docs and architecture plans, but not the
# 3.69 GB historical Raptor receipt archive. No archive is deleted from Git.
# Required job names and launcher resource ceilings remain unchanged.

jobs:
  quality:
    name: Types, format, and docs
    runs-on: ubuntu-latest
    # The native whole-program typecheck replaces the old sharded type lane.
    # Keep the existing job ceiling; optimize work rather than raising limits.
    timeout-minutes: 70
    env:
      QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/raptor3-evidence/

      # Only the comparison commit is needed, not the repository's history.
      # Materialize changed evidence too, so sparse checkout cannot hide a lint
      # failure in files this pull request actually edits.
      - name: Fetch the quality comparison and changed files
        run: |
          git fetch --no-tags --depth=1 --filter=blob:none origin "${QUALITY_BASE_SHA}"
          git diff --name-only --diff-filter=ACMRT -z "${QUALITY_BASE_SHA}" HEAD |
            xargs -0 -r git checkout --ignore-skip-worktree-bits HEAD --

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cheap gates first for fast feedback.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Verify patched dependency behavior
        run: node scripts/run-node-safe.mjs 512 60000 tests/package/security-dependencies-smoke.mjs

      - name: Check changed formatting and lint rules
        run: |
          git diff --name-only --diff-filter=ACMRT -z "${QUALITY_BASE_SHA}" HEAD |
            xargs -0 -r pnpm exec biome check --no-errors-on-unmatched

      - name: Check documentation
        run: pnpm --dir docs validate

      - name: Check whitespace
        run: git diff --check "${QUALITY_BASE_SHA}" HEAD

      # The complete lane: every file the root tsconfig intends, checked as
      # ONE native TypeScript 7 program by scripts/run-typecheck.mjs (~6 s,
      # 8192 MiB allowlisted ceiling). It is the same check `pnpm test` runs.
      - name: Check public types
        run: pnpm test:types

  core:
    name: Core tests
    runs-on: ubuntu-latest
    # Sequential Vitest shards retain the aggregate 5-minute wall ceiling and
    # the ordinary per-process memory ceiling, plus 5 minutes for setup.
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/raptor3-evidence/

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run core tests
        run: pnpm test:core

  coverage:
    name: Coverage gates
    runs-on: ubuntu-latest
    # 25 = pnpm test:coverage measured at 329s and doubled to about 11 min for a
    # hosted runner, + the 3 min ceiling of the three 60s policy tests below,
    # + 5 min setup, + roughly 6 min of headroom. No aggregate ceiling exists to
    # anchor on: run-coverage.mjs bounds every part of each of its fifteen
    # subsystems separately at 600000 ms, so their sum, 150 min, describes
    # nothing real. The former 35 predated the 329s measurement.
    timeout-minutes: 25
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/raptor3-evidence/

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # scripts/coverage-policy.test.mjs, scripts/bounded-process.test.mjs,
      # scripts/test-run-lock.test.mjs and scripts/raptor3-refusal-census.test.mjs
      # are the regression tests behind manifest completeness, the hard heap and
      # RSS ceilings, verified teardown, the workspace lock, and the refusal
      # census reading the sentences a site builds and throws through the
      # engine's failure owner. They run first and on every pull request so none
      # of that can regress while the rest of CI stays green. Each one runs
      # bounded through scripts/run-node-safe.mjs with a 512 MB heap and a 60 s
      # wall.
      - name: Run runner and coverage policy gates
        run: pnpm test:coverage:policy

      - name: Check CI stage ownership
        run: node scripts/run-node-safe.mjs 512 60000 scripts/credential-free-ci.test.mjs

      - name: Run coverage gates
        run: pnpm test:coverage

  package:
    name: Package contract (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # 15 unchanged, and still honest. pnpm test:package measured 15s, nowhere
    # near either of its launcher ceilings (package:build at 300000 ms through
    # run-node-safe.mjs, then a 5 min Vitest run), which leaves publint, attw
    # and size-limit inside roughly 8 min of accounted cost once setup is
    # counted.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22.12.0"
          - "24"
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/raptor3-evidence/

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install exact npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the package surface
        run: pnpm test:package

      - name: Lint the package contract
        run: pnpm package:lint

      - name: Check bundle-size budgets
        run: pnpm size

  local-providers:
    name: Local providers
    runs-on: ubuntu-latest
    # Retain the existing aggregate ceiling. Only unique bounded local stages
    # run here; other required jobs own the five removed duplicate stages.
    timeout-minutes: 125
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/raptor3-evidence/

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One invocation cannot hold this estate. A single live-PGlite file needs
      # roughly 1.3 GiB on its own and every process group is capped at 1536 MiB
      # of sampled RSS, so `--project=extended-local --project=provider-pglite`
      # in one process either breaches the ceiling or reports nothing.
      # scripts/run-credential-free-tests.mjs is the one owner of the bounded,
      # sharded path this repository actually runs: the extended-local shards
      # declared by scripts/credential-free-test-manifest.mjs, then each PGlite
      # provider file in its own process, then SQLite3, LibSQL, Bun and local
      # D1 - every stage launched bounded and required to prove whole-group
      # teardown before the next one starts. Invoke it; never re-expand it into
      # a single multi-project run and never raise a ceiling to fit a stage.
      # CI's other required jobs own types, core, package, Bun and D1. The
      # CI-local selection omits exactly those duplicates; default test:all
      # remains the complete local command.
      - name: Run the credential-free estate as bounded shards
        run: pnpm test:all --ci-local

  docker-providers:
    name: PostgreSQL and MySQL providers
    runs-on: ubuntu-latest
    # 40 = the 1800000 ms (30 min) wall this job's step hands to
    # run-vitest-safe.mjs, + 5 min setup, + 5 min for the PostGIS and MySQL
    # service containers to pass their health checks. At the former 30 the job
    # was cancelled before its own launcher could ever reach that ceiling, so
    # the inner limit could never fire and never report.
    timeout-minutes: 40
    services:
      postgres:
        image: postgis/postgis@sha256:8828b03e9a95269f808abe62aa83215b22a2d3710f54a55e8040327b7b5f9932 # 16-3.5
        env:
          POSTGRES_DB: viborm
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viborm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb # 8.4
        env:
          MYSQL_DATABASE: viborm
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      PG_TEST_CONNECTION_STRING: postgres://postgres:password@127.0.0.1:5432/viborm
      MYSQL_TEST_CONNECTION_STRING: mysql://root:password@127.0.0.1:3306/viborm
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/raptor3-evidence/

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Docker provider contracts
        run: >-
          node scripts/run-vitest-safe.mjs --wall-limit-ms=1800000 run
          --workspace vitest.workspace.ts
          --project=provider-pg
          --project=provider-postgres
          --project=provider-mysql2
          --project=provider-transaction-options

  platform-providers:
    name: Bun and D1 providers
    runs-on: ubuntu-latest
    # 20 unchanged: two Vitest runs at run-vitest-safe.mjs's 300000 ms default
    # ceiling, so at most 10 min of test time, + 5 min setup, + the Bun install
    # and the PostgreSQL service's health check.
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis@sha256:8828b03e9a95269f808abe62aa83215b22a2d3710f54a55e8040327b7b5f9932 # 16-3.5
        env:
          POSTGRES_DB: viborm
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viborm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_CONNECTION_STRING: postgres://postgres:password@127.0.0.1:5432/viborm
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/raptor3-evidence/

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Bun contracts
        run: >-
          node scripts/run-vitest-safe.mjs run
          --workspace vitest.workspace.ts
          --project=provider-bun

      - name: Run D1 contracts
        run: >-
          node scripts/run-vitest-safe.mjs run
          --workspace vitest.workspace.ts
          --project=provider-d1
