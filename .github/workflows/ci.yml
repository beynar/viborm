name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  NPM_VERSION: "11.15.0"
  PNPM_VERSION: "10.11.0"

# Every timeout-minutes below is derived, and each job says from what. Two kinds
# of evidence back them, and nothing else does.
#
#   Wall time measured on the maintainer's machine, 2026-08-31:
#     pnpm test:core 41s | pnpm test:package 15s | pnpm test:coverage 329s |
#     pnpm test:types 1798s | pnpm test:all, the whole credential-free
#     estate, 30-60 min.
#
#   Ceilings the bounded launchers in scripts/ already enforce, which a command
#   cannot exceed because the launcher kills it first:
#     scripts/run-vitest-safe.mjs      300000 ms, or --wall-limit-ms when
#                                      the caller passes one
#     scripts/run-typecheck-shards.mjs 3600000 ms for the complete sharded run
#     scripts/run-node-safe.mjs        the caller's number; test:coverage:policy
#                                      passes 60000 ms three times
#
# Where one aggregate ceiling covers a whole command, the job budget is that
# ceiling plus setup, so the launcher - not GitHub - is what reports an overrun,
# with its per-stage RSS and teardown lines intact. Where the only ceiling is a
# sum of dozens of per-stage ones (coverage, test:all), the measured wall is the
# anchor and is doubled, because a hosted four-vCPU runner is slower than the
# machine those figures came from. That doubling is an allowance, not a
# measurement, and it is the only unmeasured factor in this file.
#
# "Setup" means checkout, pnpm and Node setup, and pnpm install
# --frozen-lockfile. It is budgeted at five minutes everywhere.
#
# No memory limit is set, raised, or lowered here. Heap and RSS ceilings live in
# the launchers; every number below is wall clock only.

jobs:
  quality:
    name: Types, format, and docs
    runs-on: ubuntu-latest
    # 70 = the 3600000 ms (60 min) aggregate wall bound
    # scripts/run-typecheck-shards.mjs sets for the complete run, + 5 min setup,
    # + 5 min so that runner reaches its own bound and reports first instead of
    # GitHub cancelling the job and truncating the log. The former 15 could not
    # pass at all: the complete lane measured 1798s, about 30 min, on its own.
    #
    # This is shape (i), an honest timeout, rather than shape (ii), a shard
    # matrix. The shard plan is computed inside run-typecheck-shards.mjs from
    # file bytes at run time, and any shard that does not fit is halved and
    # retried, so a list of partitions written here would silently drift out of
    # sync with the real set. The runner also takes no partition flag: its
    # argument parser rejects every argument except `--fast`, which selects a
    # representative lane and is the opposite of what this job is for.
    # Distributing this lane therefore means changing that launcher, which this
    # job must not bypass. Once the runner owns a deterministic partition of
    # its own, a matrix becomes possible here with no other change.
    timeout-minutes: 70
    env:
      QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The three cheap gates run before the type lane so a formatting,
      # documentation or whitespace failure reports within a few minutes rather
      # than behind half an hour of typechecking. What they check is unchanged.
      - name: Check changed formatting and lint rules
        run: >-
          pnpm exec biome check --changed --since="${QUALITY_BASE_SHA}"
          --no-errors-on-unmatched

      - name: Check documentation
        run: pnpm --dir docs validate

      - name: Check whitespace
        run: git diff --check "${QUALITY_BASE_SHA}" HEAD

      # The complete lane: every probe and every file, run by
      # scripts/run-typecheck-shards.mjs as sequential bounded tsc programs.
      # Never narrow this to the fast lane - `pnpm test:types:fast` exists for
      # local iteration, and CI is where exhaustiveness is proved.
      - name: Check public types
        run: pnpm test:types

  core:
    name: Core tests
    runs-on: ubuntu-latest
    # 10 = the 300000 ms (5 min) default wall ceiling run-vitest-safe.mjs puts
    # on this single Vitest run, + 5 min setup. The run cannot honestly take
    # longer, because the launcher kills it first. Measured 41s. The former 30
    # bounded nothing the launcher was not already bounding six times tighter.
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run core tests
        run: pnpm test:core

  coverage:
    name: Coverage gates
    runs-on: ubuntu-latest
    # 25 = pnpm test:coverage measured at 329s and doubled to about 11 min for a
    # hosted runner, + the 3 min ceiling of the three 60s policy tests below,
    # + 5 min setup, + roughly 6 min of headroom. No aggregate ceiling exists to
    # anchor on: run-coverage.mjs bounds every part of each of its fifteen
    # subsystems separately at 600000 ms, so their sum, 150 min, describes
    # nothing real. The former 35 predated the 329s measurement.
    timeout-minutes: 25
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # scripts/coverage-policy.test.mjs, scripts/bounded-process.test.mjs and
      # scripts/test-run-lock.test.mjs are the regression tests behind manifest
      # completeness, the hard heap and RSS ceilings, verified teardown, and the
      # workspace lock. They run first and on every pull request so none of that
      # can regress while the rest of CI stays green. Each one runs bounded
      # through scripts/run-node-safe.mjs with a 512 MB heap and a 60 s wall.
      - name: Run runner and coverage policy gates
        run: pnpm test:coverage:policy

      - name: Run coverage gates
        run: pnpm test:coverage

  package:
    name: Package contract (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # 15 unchanged, and still honest. pnpm test:package measured 15s, nowhere
    # near either of its launcher ceilings (package:build at 300000 ms through
    # run-node-safe.mjs, then a 5 min Vitest run), which leaves publint, attw
    # and size-limit inside roughly 8 min of accounted cost once setup is
    # counted.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22.12.0"
          - "24"
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install exact npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the package surface
        run: pnpm test:package

      - name: Lint the package contract
        run: pnpm package:lint

      - name: Check bundle-size budgets
        run: pnpm size

  local-providers:
    name: Local providers
    runs-on: ubuntu-latest
    # 125 = the 60 min top of the measured 30-60 min range for the whole
    # credential-free estate, doubled for a hosted runner, + 5 min setup. The
    # estate is 109 sequential bounded stages rather than one Vitest run: pnpm
    # test, 81 extended-local shards, one process per PGlite provider file (6),
    # then SQLite3 (9), LibSQL (9), Bun, D1 and pnpm test:package, each with its
    # own launcher ceiling. This is scheduling headroom only: no heap, RSS, or
    # per-stage wall limit changes with it. The former 180 had no measurement
    # behind it.
    timeout-minutes: 125
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One invocation cannot hold this estate. A single live-PGlite file needs
      # roughly 1.3 GiB on its own and every process group is capped at 1536 MiB
      # of sampled RSS, so `--project=extended-local --project=provider-pglite`
      # in one process either breaches the ceiling or reports nothing.
      # scripts/run-credential-free-tests.mjs is the one owner of the bounded,
      # sharded path this repository actually runs: the extended-local shards
      # declared by scripts/credential-free-test-manifest.mjs, then each PGlite
      # provider file in its own process, then SQLite3, LibSQL, Bun and local
      # D1 - every stage launched bounded and required to prove whole-group
      # teardown before the next one starts. Invoke it; never re-expand it into
      # a single multi-project run and never raise a ceiling to fit a stage.
      # Its first and last stages are `pnpm test` and `pnpm test:package`, which
      # the quality, core, and package jobs also run on their own for fast
      # feedback; this job is the single owner of the estate as a whole.
      - name: Run the credential-free estate as bounded shards
        run: pnpm test:all

  docker-providers:
    name: PostgreSQL and MySQL providers
    runs-on: ubuntu-latest
    # 40 = the 1800000 ms (30 min) wall this job's step hands to
    # run-vitest-safe.mjs, + 5 min setup, + 5 min for the PostGIS and MySQL
    # service containers to pass their health checks. At the former 30 the job
    # was cancelled before its own launcher could ever reach that ceiling, so
    # the inner limit could never fire and never report.
    timeout-minutes: 40
    services:
      postgres:
        image: postgis/postgis@sha256:8828b03e9a95269f808abe62aa83215b22a2d3710f54a55e8040327b7b5f9932 # 16-3.5
        env:
          POSTGRES_DB: viborm
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viborm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb # 8.4
        env:
          MYSQL_DATABASE: viborm
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      PG_TEST_CONNECTION_STRING: postgres://postgres:password@127.0.0.1:5432/viborm
      MYSQL_TEST_CONNECTION_STRING: mysql://root:password@127.0.0.1:3306/viborm
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Docker provider contracts
        run: >-
          node scripts/run-vitest-safe.mjs --wall-limit-ms=1800000 run
          --workspace vitest.workspace.ts
          --project=provider-pg
          --project=provider-postgres
          --project=provider-mysql2
          --project=provider-transaction-options

  platform-providers:
    name: Bun and D1 providers
    runs-on: ubuntu-latest
    # 20 unchanged: two Vitest runs at run-vitest-safe.mjs's 300000 ms default
    # ceiling, so at most 10 min of test time, + 5 min setup, + the Bun install
    # and the PostgreSQL service's health check.
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis@sha256:8828b03e9a95269f808abe62aa83215b22a2d3710f54a55e8040327b7b5f9932 # 16-3.5
        env:
          POSTGRES_DB: viborm
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viborm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_CONNECTION_STRING: postgres://postgres:password@127.0.0.1:5432/viborm
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Bun contracts
        run: >-
          node scripts/run-vitest-safe.mjs run
          --workspace vitest.workspace.ts
          --project=provider-bun

      - name: Run D1 contracts
        run: >-
          node scripts/run-vitest-safe.mjs run
          --workspace vitest.workspace.ts
          --project=provider-d1
