name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  NPM_VERSION: "11.15.0"
  PNPM_VERSION: "10.11.0"

# Checkouts retain source, tests, live docs and architecture plans, but not the
# 3.69 GB historical Raptor receipt archive. No archive is deleted from Git.
# Required job names and launcher resource ceilings remain unchanged.

jobs:
  quality:
    name: Types, format, and docs
    runs-on: ubuntu-latest
    # The native whole-program typecheck replaces the old sharded type lane.
    # Keep the existing job ceiling; optimize work rather than raising limits.
    timeout-minutes: 70
    env:
      QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/raptor3-evidence/

      # Only the comparison commit is needed, not the repository's history.
      # Materialize changed evidence too, so sparse checkout cannot hide a lint
      # failure in files this pull request actually edits.
      - name: Fetch the quality comparison and changed files
        run: |
          git fetch --no-tags --depth=1 --filter=blob:none origin "${QUALITY_BASE_SHA}"
          git diff --name-only --diff-filter=ACMRT -z "${QUALITY_BASE_SHA}" HEAD |
            xargs -0 -r git checkout --ignore-skip-worktree-bits HEAD --

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cheap gates first for fast feedback.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Verify patched dependency behavior
        run: node scripts/run-node-safe.mjs 512 60000 tests/package/security-dependencies-smoke.mjs

      - name: Check changed formatting and lint rules
        run: |
          git diff --name-only --diff-filter=ACMRT -z "${QUALITY_BASE_SHA}" HEAD |
            xargs -0 -r pnpm exec biome check --no-errors-on-unmatched

      - name: Check documentation
        run: pnpm --dir docs validate

      - name: Build documentation under the project resource ceiling
        run: pnpm --dir docs build

      - name: Preserve the exact documentation build for render verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viborm-docs-${{ github.sha }}
          path: docs/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Verify the documentation worker without deploying
        working-directory: docs
        env:
          WRANGLER_SEND_METRICS: "false"
        run: >-
          node ../scripts/run-node-safe.mjs 512 60000
          node_modules/wrangler/bin/wrangler.js deploy
          --dry-run --config dist/server/wrangler.json
          --outdir "${RUNNER_TEMP}/viborm-docs-worker"

      - name: Check whitespace
        run: git diff --check "${QUALITY_BASE_SHA}" HEAD

      # The complete lane: every file the root tsconfig intends, checked as
      # ONE native TypeScript 7 program by scripts/run-typecheck.mjs (serial,
      # 8192 MiB allowlisted ceiling). It is the same check `pnpm test` runs.
      - name: Check public types
        run: pnpm test:types

  core:
    name: Core tests
    runs-on: ubuntu-latest
    # Sequential Vitest shards retain the aggregate 5-minute wall ceiling and
    # the ordinary per-process memory ceiling, plus 5 minutes for setup.
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/raptor3-evidence/

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run core tests
        run: pnpm test:core

  coverage:
    name: Coverage gates
    runs-on: ubuntu-latest
    # Retain the 25-minute job ceiling. CI12's 14 projects / 86 bounded parts
    # took 17.5 minutes; policy checks and setup fit the remaining time.
    # Each coverage part still has its own unchanged 600000 ms ceiling.
    timeout-minutes: 25
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/raptor3-evidence/

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # scripts/coverage-policy.test.mjs, scripts/bounded-process.test.mjs,
      # scripts/test-run-lock.test.mjs and scripts/raptor3-refusal-census.test.mjs
      # are the regression tests behind manifest completeness, the hard heap and
      # RSS ceilings, verified teardown, the workspace lock, and the refusal
      # census reading the sentences a site builds and throws through the
      # engine's failure owner. They run first and on every pull request so none
      # of that can regress while the rest of CI stays green. Each one runs
      # bounded through scripts/run-node-safe.mjs with a 512 MB heap and a 60 s
      # wall.
      - name: Run runner and coverage policy gates
        run: pnpm test:coverage:policy

      - name: Check CI stage ownership
        run: |
          node scripts/run-node-safe.mjs 512 60000 scripts/credential-free-ci.test.mjs
          node scripts/run-node-safe.mjs 512 60000 scripts/prepare-ci-local-shards.test.mjs

      - name: Run coverage gates
        run: pnpm test:coverage

  package:
    name: Package contract (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Retain the 15-minute job ceiling and the separate 300000 ms build and
    # consumer limits. CI12's slower consumer suite took 236 seconds.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22.12.0"
          - "24"
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/raptor3-evidence/

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install exact npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the package surface
        run: pnpm test:package

      - name: Lint the package contract
        run: pnpm package:lint

      - name: Check bundle-size budgets
        run: pnpm size

  local-providers:
    name: Local providers
    runs-on: ubuntu-latest
    # Retain the existing aggregate ceiling. Only unique bounded local stages
    # run here; other required jobs own the five removed duplicate stages.
    timeout-minutes: 125
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/raptor3-evidence/

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Four independent repositories keep workspace locks, dependency caches
      # and outputs private. Each lane runs the existing bounded stages serially.
      # At most four 2560 MiB PGlite groups fit this public 4-core/16 GiB runner;
      # ordinary groups retain 1536 MiB. No native typecheck or package build
      # runs alongside these lanes.
      - name: Prepare isolated local-provider workspaces
        timeout-minutes: 5
        run: |
          node scripts/run-node-safe.mjs 512 120000 scripts/prepare-ci-local-shards.mjs "${RUNNER_TEMP}/viborm-ci-local"
          for lane in 2 3 4; do
            pnpm --dir "${RUNNER_TEMP}/viborm-ci-local/${lane}" install --offline --frozen-lockfile
          done

      # This stage uses about 100 of its 120 seconds. Keep it free of sibling
      # CPU contention; the four shards partition the remaining 96 stages.
      - name: Run the fixed Raptor contracts
        run: pnpm test:all --ci-local --only 'Raptor 3 fixed'

      # The implicit wait fails the job if any lane fails. Including the serial
      # stage above, all 97 unique stages run exactly once with the same limits.
      - parallel:
          - name: Run local-provider shard 1/4
            env:
              TMPDIR: ${{ runner.temp }}/viborm-ci-local/tmp-1
            run: pnpm test:all --ci-local --shard=1/4

          - name: Run local-provider shard 2/4
            working-directory: ${{ runner.temp }}/viborm-ci-local/2
            env:
              TMPDIR: ${{ runner.temp }}/viborm-ci-local/tmp-2
            run: pnpm test:all --ci-local --shard=2/4

          - name: Run local-provider shard 3/4
            working-directory: ${{ runner.temp }}/viborm-ci-local/3
            env:
              TMPDIR: ${{ runner.temp }}/viborm-ci-local/tmp-3
            run: pnpm test:all --ci-local --shard=3/4

          - name: Run local-provider shard 4/4
            working-directory: ${{ runner.temp }}/viborm-ci-local/4
            env:
              TMPDIR: ${{ runner.temp }}/viborm-ci-local/tmp-4
            run: pnpm test:all --ci-local --shard=4/4

  docker-providers:
    name: PostgreSQL and MySQL providers
    runs-on: ubuntu-latest
    # 40 = the 1800000 ms (30 min) wall this job's step hands to
    # run-vitest-safe.mjs, + 5 min setup, + 5 min for the PostGIS and MySQL
    # service containers to pass their health checks. At the former 30 the job
    # was cancelled before its own launcher could ever reach that ceiling, so
    # the inner limit could never fire and never report.
    timeout-minutes: 40
    services:
      postgres:
        image: postgis/postgis@sha256:8828b03e9a95269f808abe62aa83215b22a2d3710f54a55e8040327b7b5f9932 # 16-3.5
        env:
          POSTGRES_DB: viborm
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viborm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb # 8.4
        env:
          MYSQL_DATABASE: viborm
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      PG_TEST_CONNECTION_STRING: postgres://postgres:password@127.0.0.1:5432/viborm
      MYSQL_TEST_CONNECTION_STRING: mysql://root:password@127.0.0.1:3306/viborm
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/raptor3-evidence/

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Docker provider contracts
        run: >-
          node scripts/run-vitest-safe.mjs --wall-limit-ms=1800000 run
          --workspace vitest.workspace.ts
          --project=provider-pg
          --project=provider-postgres
          --project=provider-mysql2
          --project=provider-transaction-options

  platform-providers:
    name: Bun and D1 providers
    runs-on: ubuntu-latest
    # 20 unchanged: two Vitest runs at run-vitest-safe.mjs's 300000 ms default
    # ceiling, so at most 10 min of test time, + 5 min setup, + the Bun install
    # and the PostgreSQL service's health check.
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis@sha256:8828b03e9a95269f808abe62aa83215b22a2d3710f54a55e8040327b7b5f9932 # 16-3.5
        env:
          POSTGRES_DB: viborm
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viborm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_CONNECTION_STRING: postgres://postgres:password@127.0.0.1:5432/viborm
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/raptor3-evidence/

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Bun contracts
        run: >-
          node scripts/run-vitest-safe.mjs run
          --workspace vitest.workspace.ts
          --project=provider-bun

      - name: Run D1 contracts
        run: >-
          node scripts/run-vitest-safe.mjs run
          --workspace vitest.workspace.ts
          --project=provider-d1
