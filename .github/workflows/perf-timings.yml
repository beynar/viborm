name: Performance timings

# Absolute wall-clock budgets, asserted only here (VIBORM_PERF_TIMINGS=1, see
# tests/fixtures/perf-timings.ts). Pull-request CI runs the same test files and
# keeps every behaviour and statement-count assertion; only the millisecond
# bounds wait for this nightly and manual run. Nothing waits for it: neither
# branch protection nor scripts/release-ci.mjs reads this workflow.

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-timings-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.11.0"

jobs:
  timings:
    name: Performance timings
    runs-on: ubuntu-latest
    # Two Vitest runs at run-vitest-safe.mjs's 300000 ms default ceiling,
    # + 5 min setup.
    timeout-minutes: 15
    env:
      VIBORM_PERF_TIMINGS: "1"
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/raptor3-evidence/

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert schema and validation timing budgets
        run: >-
          node scripts/run-vitest-safe.mjs run
          --workspace vitest.workspace.ts
          --project=layer-operation-schemas
          --project=layer-validation
          tests/unit/operation-schemas/args/speed.core.test.ts
          tests/unit/validation/geo-area.core.test.ts

      - name: Assert SQLite temporal-scale timing budgets
        run: >-
          node scripts/run-vitest-safe.mjs run
          --workspace vitest.workspace.ts
          --project=provider-sqlite3
          tests/providers/local/sqlite3-temporal-scale.test.ts
