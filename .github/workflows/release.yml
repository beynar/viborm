name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version, without the v tag prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: viborm-npm-production
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_VERSION: "11.15.0"
  PNPM_VERSION: "10.11.0"

# Source qualification belongs to CI on the exact protected-main SHA.
# Release waits for that evidence, builds one tarball, and verifies its bytes.
# Existing job ceilings are unchanged; no test runner limit is bypassed.

jobs:
  authorize:
    name: Authorize release input
    runs-on: ubuntu-latest
    # 5 unchanged: no test lane, no build, and no registry call runs here.
    # `release.mjs contract` reads package.json, the release contract file and
    # git, so the job is a shallow metadata checkout, Node, one global npm install
    # and a few git commands.
    timeout-minutes: 5
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: scripts

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install exact npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Validate release authority
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: >-
          node scripts/release.mjs contract
          --version "${RELEASE_VERSION}"
          --ref "${RELEASE_REF}"
          --main-sha "${RELEASE_SHA}"

  source-ci:
    name: Verify exact-main CI
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    # Reuse the former full-estate ceiling while CI runs, not its test work.
    # The verifier waits at most 120 minutes, leaving five for setup.
    timeout-minutes: 125
    steps:
      - name: Check out release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: scripts

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Require successful CI on this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-ci.mjs --wait

  docs:
    name: Release documentation
    needs: authorize
    runs-on: ubuntu-latest
    # 15 unchanged: setup plus `blume validate` and `blume build` over the docs
    # workspace. No test lane and no launcher ceiling to anchor on, so this is a
    # documentation build with headroom rather than a derived ceiling.
    timeout-minutes: 15
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies without a release cache
        run: pnpm install --frozen-lockfile

      - name: Validate documentation
        run: pnpm --dir docs validate

      - name: Build documentation
        run: pnpm --dir docs build

  artifact:
    name: Build and test release tarball
    needs: authorize
    runs-on: ubuntu-latest
    # 20 = 10 min of launcher ceilings inside `release.mjs artifact` (300000 ms
    # for package:build through run-node-safe.mjs, then 300000 ms for the
    # package Vitest project through run-vitest-safe.mjs), + 5 min setup, + 5
    # min for the unbounded remainder: size-limit, npm pack, publint and attw.
    timeout-minutes: 20
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/architecture/

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install exact npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies without a release cache
        run: pnpm install --frozen-lockfile

      - name: Build and test one exact tarball
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: >-
          node scripts/release.mjs artifact
          --version "${RELEASE_VERSION}"
          --ref "${RELEASE_REF}"
          --main-sha "${RELEASE_SHA}"

      - name: Upload the tested tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viborm-release
          path: |
            release/viborm-release.json
            release/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish exact tarball to npm
    needs:
      - source-ci
      - docs
      - artifact
      - node-floor
    runs-on: ubuntu-latest
    # 20: an artifact download, a re-run of the git-only release contract, one
    # `npm publish`, and two registry verifications whose retry ladder in
    # scripts/release.mjs waits about eight minutes in total across its
    # thirteen attempts, because npm serves a freshly published version only
    # after asynchronous processing that it says may take a few minutes.
    timeout-minutes: 20
    environment:
      name: npm-production
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      channel: ${{ steps.registry.outputs.channel }}
      tarball: ${{ steps.registry.outputs.tarball }}
      version: ${{ steps.registry.outputs.version }}
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: scripts

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install exact npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Download the tested tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: viborm-release
          path: release

      - name: Verify artifact handoff
        run: >-
          node scripts/release.mjs verify-artifact
          --manifest release/viborm-release.json

      - name: Reauthenticate protected main after approval
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git fetch --depth=1 --filter=blob:none --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          node scripts/release.mjs contract \
            --version "${RELEASE_VERSION}" \
            --ref "${RELEASE_REF}" \
            --main-sha "${RELEASE_SHA}"

      - name: Recheck exact-main CI after approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-ci.mjs

      - name: Check registry state
        id: registry
        run: >-
          node scripts/release.mjs verify-registry
          --manifest release/viborm-release.json
          --github-output "${GITHUB_OUTPUT}"

      - name: Publish through npm trusted publishing
        if: steps.registry.outputs.publish == 'true'
        env:
          RELEASE_CHANNEL: ${{ steps.registry.outputs.channel }}
          RELEASE_TARBALL: ${{ steps.registry.outputs.tarball }}
        run: >-
          npm publish "./release/${RELEASE_TARBALL}"
          --tag "${RELEASE_CHANNEL}"

      - name: Verify published registry bytes
        run: >-
          node scripts/release.mjs verify-registry
          --manifest release/viborm-release.json
          --require-present

  node-floor:
    name: Exact tarball on Node 22.0.0
    needs: artifact
    runs-on: ubuntu-latest
    # 15: Node 22.0.0 setup, an artifact download, then one clean npm install of
    # the tarball into a temporary consumer plus an export probe and a CLI
    # --help. No repository install, no build, no test lane; the budget is
    # network install time with headroom.
    timeout-minutes: 15
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: scripts

      - name: Install Node.js floor
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.0.0"

      - name: Download the tested tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: viborm-release
          path: release

      - name: Verify public package on Node 22.0.0
        run: >-
          node scripts/release.mjs verify-artifact-consumer
          --manifest release/viborm-release.json

  finalize:
    name: Verify release before GitHub publication
    needs: publish
    runs-on: ubuntu-latest
    # 20: artifact and registry reauthentication, whose retry ladder waits at
    # most about eight minutes, then one fresh install of the published version
    # from the registry with a signature audit, an export probe and a CLI --help.
    timeout-minutes: 20
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: scripts

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install exact npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Download the published tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: viborm-release
          path: release

      - name: Reauthenticate artifact and registry
        run: |
          node scripts/release.mjs verify-artifact \
            --manifest release/viborm-release.json
          node scripts/release.mjs verify-registry \
            --manifest release/viborm-release.json \
            --require-present

      - name: Verify a fresh registry consumer and CLI
        run: >-
          node scripts/release.mjs verify-consumer
          --manifest release/viborm-release.json

  github-release:
    name: Create immutable GitHub release
    needs:
      - publish
      - finalize
    runs-on: ubuntu-latest
    # 10: a shallow script checkout, an artifact download, one annotated tag push,
    # and the GitHub release API calls in scripts/github-release.mjs.
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: scripts

      - name: Download the verified tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: viborm-release
          path: release

      - name: Create the annotated release tag
        env:
          RELEASE_TAG: v${{ needs.publish.outputs.version }}
        run: |
          if git fetch --depth=1 --filter=blob:none origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" 2>/dev/null; then
            test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${GITHUB_SHA}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "${RELEASE_TAG}" "${GITHUB_SHA}" --message "VibORM ${RELEASE_TAG#v}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Publish or verify immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          node scripts/github-release.mjs publish
          --manifest release/viborm-release.json
          --repository "${GITHUB_REPOSITORY}"
