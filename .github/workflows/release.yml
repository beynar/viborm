name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version, without the v tag prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: viborm-npm-production
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  NPM_VERSION: "11.15.0"
  PNPM_VERSION: "10.11.0"

# Every timeout-minutes below is derived, and each job says from what, on the
# same two kinds of evidence .github/workflows/ci.yml records at length.
#
#   Wall time measured on the maintainer's machine, 2026-08-31:
#     pnpm test:package 15s | pnpm test:coverage 329s | pnpm test:all, the whole
#     credential-free estate, 30-60 min.
#
#   Ceilings the bounded launchers in scripts/ already enforce:
#     scripts/run-vitest-safe.mjs 300000 ms unless --wall-limit-ms overrides,
#     scripts/run-node-safe.mjs the caller's number (package:build passes
#     300000 ms; test:coverage:policy passes 60000 ms three times).
#
# Where one aggregate ceiling covers a command, the budget is that ceiling plus
# setup, so the launcher and not GitHub reports an overrun. Where the only
# ceiling is a sum of dozens of per-stage ones, the measured wall is the anchor
# and is doubled for a hosted four-vCPU runner; that doubling is an allowance,
# not a measurement. "Setup" means checkout, pnpm and Node setup, and pnpm
# install --frozen-lockfile, budgeted at five minutes. Release-only jobs that
# run no test lane are budgeted from what they actually do, named job by job.
#
# No memory limit is set, raised, or lowered here. Heap and RSS ceilings live in
# the launchers; every number below is wall clock only.

jobs:
  authorize:
    name: Authorize release input
    runs-on: ubuntu-latest
    # 5 unchanged: no test lane, no build, and no registry call runs here.
    # `release.mjs contract` reads package.json, the release contract file and
    # git, so the job is a full-history checkout, Node, one global npm install
    # and a few git commands.
    timeout-minutes: 5
    steps:
      - name: Check out the complete release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install exact npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Validate release authority
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: >-
          node scripts/release.mjs contract
          --version "${RELEASE_VERSION}"
          --ref "${RELEASE_REF}"
          --main-sha "${RELEASE_SHA}"

  full-tests:
    name: Complete test estate
    needs: authorize
    runs-on: ubuntu-latest
    # 125 = the 60 min top of the measured 30-60 min range for the whole
    # credential-free estate, doubled for a hosted runner, + 5 min setup.
    # `pnpm test:all` is 109 sequential bounded stages rather than one Vitest
    # run: pnpm test, 81 extended-local shards, one process per PGlite provider
    # file (6), then SQLite3 (9), LibSQL (9), Bun, D1 and pnpm test:package,
    # each with its own launcher ceiling. This is scheduling headroom only: no
    # heap, RSS, or per-stage wall limit changes with it. The former 180 had no
    # measurement behind it.
    timeout-minutes: 125
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install exact npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies without a release cache
        run: pnpm install --frozen-lockfile

      # scripts/run-credential-free-tests.mjs owns the bounded, sharded path:
      # the extended-local shards from scripts/credential-free-test-manifest.mjs
      # and then one process per PGlite provider file, each proving whole-group
      # teardown before the next starts. Never re-expand it into one Vitest run.
      - name: Run the complete local estate
        run: pnpm test:all

  coverage:
    name: Release coverage gates
    needs: authorize
    runs-on: ubuntu-latest
    # 25 = pnpm test:coverage measured at 329s and doubled to about 11 min for a
    # hosted runner, + the 3 min ceiling of the three 60s policy tests below,
    # + 5 min setup, + roughly 6 min of headroom. No aggregate ceiling exists to
    # anchor on: run-coverage.mjs bounds every part of each of its fifteen
    # subsystems separately at 600000 ms, so their sum, 150 min, describes
    # nothing real. The former 35 predated the 329s measurement.
    timeout-minutes: 25
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies without a release cache
        run: pnpm install --frozen-lockfile

      # Release acceptance must prove the runner contract itself, not only the
      # numbers: scripts/coverage-policy.test.mjs (manifest completeness),
      # scripts/bounded-process.test.mjs (heap and RSS ceilings, verified
      # teardown) and scripts/test-run-lock.test.mjs (workspace lock). Each one
      # runs bounded through scripts/run-node-safe.mjs with a 512 MB heap and a
      # 60 s wall.
      - name: Run runner and coverage policy gates
        run: pnpm test:coverage:policy

      - name: Run coverage gates
        run: pnpm test:coverage

  docs:
    name: Release documentation
    needs: authorize
    runs-on: ubuntu-latest
    # 15 unchanged: setup plus `blume validate` and `blume build` over the docs
    # workspace. No test lane and no launcher ceiling to anchor on, so this is a
    # documentation build with headroom rather than a derived ceiling.
    timeout-minutes: 15
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies without a release cache
        run: pnpm install --frozen-lockfile

      - name: Validate documentation
        run: pnpm --dir docs validate

      - name: Build documentation
        run: pnpm --dir docs build

  docker-providers:
    name: Release PostgreSQL and MySQL providers
    needs: authorize
    runs-on: ubuntu-latest
    # 40 = the 1800000 ms (30 min) wall this job's step hands to
    # run-vitest-safe.mjs, + 5 min setup, + 5 min for the PostGIS and MySQL
    # service containers to pass their health checks. At the former 30 the job
    # was cancelled before its own launcher could ever reach that ceiling, so
    # the inner limit could never fire and never report.
    timeout-minutes: 40
    services:
      postgres:
        image: postgis/postgis@sha256:8828b03e9a95269f808abe62aa83215b22a2d3710f54a55e8040327b7b5f9932 # 16-3.5
        env:
          POSTGRES_DB: viborm
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viborm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb # 8.4
        env:
          MYSQL_DATABASE: viborm
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      PG_TEST_CONNECTION_STRING: postgres://postgres:password@127.0.0.1:5432/viborm
      MYSQL_TEST_CONNECTION_STRING: mysql://root:password@127.0.0.1:3306/viborm
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies without a release cache
        run: pnpm install --frozen-lockfile

      - name: Run Docker provider contracts
        run: >-
          node scripts/run-vitest-safe.mjs --wall-limit-ms=1800000 run
          --workspace vitest.workspace.ts
          --project=provider-pg
          --project=provider-postgres
          --project=provider-mysql2
          --project=provider-transaction-options

  platform-providers:
    name: Release Bun and D1 providers
    needs: authorize
    runs-on: ubuntu-latest
    # 20 unchanged: two Vitest runs at run-vitest-safe.mjs's 300000 ms default
    # ceiling, so at most 10 min of test time, + 5 min setup, + the Bun install
    # and the PostgreSQL service's health check.
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis@sha256:8828b03e9a95269f808abe62aa83215b22a2d3710f54a55e8040327b7b5f9932 # 16-3.5
        env:
          POSTGRES_DB: viborm
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viborm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_CONNECTION_STRING: postgres://postgres:password@127.0.0.1:5432/viborm
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies without a release cache
        run: pnpm install --frozen-lockfile

      - name: Run Bun contracts
        run: >-
          node scripts/run-vitest-safe.mjs run
          --workspace vitest.workspace.ts
          --project=provider-bun

      - name: Run D1 contracts
        run: >-
          node scripts/run-vitest-safe.mjs run
          --workspace vitest.workspace.ts
          --project=provider-d1

  artifact:
    name: Build and test release tarball
    needs:
      - full-tests
      - coverage
      - docs
      - docker-providers
      - platform-providers
    runs-on: ubuntu-latest
    # 20 = 10 min of launcher ceilings inside `release.mjs artifact` (300000 ms
    # for package:build through run-node-safe.mjs, then 300000 ms for the
    # package Vitest project through run-vitest-safe.mjs), + 5 min setup, + 5
    # min for the unbounded remainder: size-limit, npm pack, publint and attw.
    timeout-minutes: 20
    steps:
      - name: Check out the complete release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install exact npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies without a release cache
        run: pnpm install --frozen-lockfile

      - name: Build and test one exact tarball
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: >-
          node scripts/release.mjs artifact
          --version "${RELEASE_VERSION}"
          --ref "${RELEASE_REF}"
          --main-sha "${RELEASE_SHA}"

      - name: Upload the tested tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viborm-release
          path: |
            release/viborm-release.json
            release/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish exact tarball to npm
    needs:
      - artifact
      - node-floor
    runs-on: ubuntu-latest
    # 10: an artifact download, a re-run of the git-only release contract, one
    # `npm publish`, and two registry verifications whose retry ladder in
    # scripts/release.mjs sleeps 60s in total across its six attempts.
    timeout-minutes: 10
    environment:
      name: npm-production
    permissions:
      contents: read
      id-token: write
    outputs:
      channel: ${{ steps.registry.outputs.channel }}
      tarball: ${{ steps.registry.outputs.tarball }}
      version: ${{ steps.registry.outputs.version }}
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install exact npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Download the tested tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: viborm-release
          path: release

      - name: Verify artifact handoff
        run: >-
          node scripts/release.mjs verify-artifact
          --manifest release/viborm-release.json

      - name: Reauthenticate protected main after approval
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          node scripts/release.mjs contract \
            --version "${RELEASE_VERSION}" \
            --ref "${RELEASE_REF}" \
            --main-sha "${RELEASE_SHA}"

      - name: Check registry state
        id: registry
        run: >-
          node scripts/release.mjs verify-registry
          --manifest release/viborm-release.json
          --github-output "${GITHUB_OUTPUT}"

      - name: Publish through npm trusted publishing
        if: steps.registry.outputs.publish == 'true'
        env:
          RELEASE_CHANNEL: ${{ steps.registry.outputs.channel }}
          RELEASE_TARBALL: ${{ steps.registry.outputs.tarball }}
        run: >-
          npm publish "release/${RELEASE_TARBALL}"
          --tag "${RELEASE_CHANNEL}"

      - name: Verify published registry bytes
        run: >-
          node scripts/release.mjs verify-registry
          --manifest release/viborm-release.json
          --require-present

  node-floor:
    name: Exact tarball on Node 22.0.0
    needs: artifact
    runs-on: ubuntu-latest
    # 15: Node 22.0.0 setup, an artifact download, then one clean npm install of
    # the tarball into a temporary consumer plus an export probe and a CLI
    # --help. No repository install, no build, no test lane; the budget is
    # network install time with headroom.
    timeout-minutes: 15
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js floor
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.0.0"

      - name: Download the tested tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: viborm-release
          path: release

      - name: Verify public package on Node 22.0.0
        run: >-
          node scripts/release.mjs verify-artifact-consumer
          --manifest release/viborm-release.json

  finalize:
    name: Verify release before GitHub publication
    needs: publish
    runs-on: ubuntu-latest
    # 10: artifact and registry reauthentication, whose retry ladder sleeps at
    # most 60s, then one fresh install of the published version from the
    # registry with a signature audit, an export probe and a CLI --help.
    timeout-minutes: 10
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install exact npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Download the published tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: viborm-release
          path: release

      - name: Reauthenticate artifact and registry
        run: |
          node scripts/release.mjs verify-artifact \
            --manifest release/viborm-release.json
          node scripts/release.mjs verify-registry \
            --manifest release/viborm-release.json \
            --require-present

      - name: Verify a fresh registry consumer and CLI
        run: >-
          node scripts/release.mjs verify-consumer
          --manifest release/viborm-release.json

  github-release:
    name: Create immutable GitHub release
    needs:
      - publish
      - finalize
    runs-on: ubuntu-latest
    # 10: a full-history checkout, an artifact download, one annotated tag push,
    # and the GitHub release API calls in scripts/github-release.mjs.
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the complete release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download the verified tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: viborm-release
          path: release

      - name: Create the annotated release tag
        env:
          RELEASE_TAG: v${{ needs.publish.outputs.version }}
        run: |
          if git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" 2>/dev/null; then
            test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${GITHUB_SHA}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "${RELEASE_TAG}" "${GITHUB_SHA}" --message "VibORM ${RELEASE_TAG#v}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Publish or verify immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          node scripts/github-release.mjs publish
          --manifest release/viborm-release.json
          --repository "${GITHUB_REPOSITORY}"
