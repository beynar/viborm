version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Types follow the oldest supported Node (engines >=22): a newer major
      # brings APIs, and undici types, that Node 22 does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
